name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - run: go mod download

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: make fmt-check

      - run: go vet ./...

      - name: Test (race detector)
        if: matrix.os == 'ubuntu-latest'
        run: go test -race ./...

      - name: Test
        if: matrix.os != 'ubuntu-latest'
        run: go test ./...

      - name: Build
        if: matrix.os == 'ubuntu-latest'
        run: |
          make build
          make linux
          make windows
